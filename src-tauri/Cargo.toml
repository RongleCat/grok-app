[package]
name = "grok-app"
version = "0.1.8"
description = "Grok — desktop workbench for Grok Build CLI"
authors = ["RongleCat"]
edition = "2021"

[lib]
name = "grok_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` — multi-webview (resource pane embedded browser)
# `macos-private-api` — required by tauri.macos.conf.json `macOSPrivateApi: true`
#   (transparent titlebar + window-vibrancy). Keep the feature on all targets so
#   cargo-xwin Windows cross-builds pass tauri-build feature allowlist checks;
#   runtime effect is macOS-only.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png", "unstable"] }
tauri-plugin-store = "2"
# Second launch focuses existing window (Dock multi-open reports).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

directories = "6"
which = "7"
chrono = { version = "0.4", features = ["serde", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart", "system-proxy"] }
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rfd = "0.15"
window-vibrancy = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }
# OS secret store: macOS Keychain / Windows Credential Manager / Linux Secret Service.
# No default features — enable platform stores explicitly; file fallback lives in secrets.rs.
keyring = { version = "3.6", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
fs2 = "0.4"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2"

# Remote mirror host (HTTP + WS + token gate) — see src/mirror/
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
rand = "0.8"

# Windows system proxy (WinINET registry) for child-process env injection — NEW-02.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
